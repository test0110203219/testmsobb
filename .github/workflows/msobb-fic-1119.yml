name: msobb-flex-fic-1119
on:
  push:
    branches:
      - 'msobb-fic-1119-*'
permissions:
  contents: read
  id-token: write
jobs:
  claim-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exchange GitHub OIDC token with bounded Entra FIC
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2FAzureADTokenExchange")
          GH_OIDC_RESPONSE="$response" python3 - <<'PY'
          import base64, json, os, urllib.parse, urllib.request, urllib.error
          assertion = json.loads(os.environ['GH_OIDC_RESPONSE'])['value']
          part = assertion.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(part + '=' * (-len(part) % 4)))
          body = urllib.parse.urlencode({'client_id':'4e71fe81-0fb0-4b15-8b7b-b29e397d217b','scope':'https://management.azure.com/.default','grant_type':'client_credentials','client_assertion_type':'urn:ietf:params:oauth:client-assertion-type:jwt-bearer','client_assertion':assertion}).encode()
          req = urllib.request.Request('https://login.microsoftonline.com/bd494005-de34-4704-b9dc-e4c6bc915eec/oauth2/v2.0/token',data=body,headers={'Content-Type':'application/x-www-form-urlencoded'})
          try:
              with urllib.request.urlopen(req,timeout=25) as res:
                  status = res.status
                  data = json.loads(res.read())
          except urllib.error.HTTPError as ex:
              status = ex.code
              data = json.loads(ex.read())
          out = {'ref': claims.get('ref'), 'sub': claims.get('sub'), 'repository_id': claims.get('repository_id'), 'http': status, 'error_code': (data.get('error_codes') or [None])[0]}
          if status == 200:
              bearer = data.get('access_token','')
              p = bearer.split('.')[1]
              issued = json.loads(base64.urlsafe_b64decode(p + '=' * (-len(p) % 4)))
              out['expected_identity'] = issued.get('oid','').lower() == '3f27106b-6db1-49b3-8bf6-d80a32aa38ce'
          print(json.dumps(out,sort_keys=True))
          PY
