name: msobb-flex-fic-1119
on:
  push:
    branches:
      - 'msobb-fic-1119-*'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  claim-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read GitHub OIDC claim selectors
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2FAzureADTokenExchange")
          GH_OIDC_RESPONSE="$response" python3 - <<'PY'
          import base64, json, os
          raw = json.loads(os.environ['GH_OIDC_RESPONSE'])['value']
          part = raw.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(part + '=' * (-len(part) % 4)))
          print(json.dumps({k: claims.get(k) for k in ('iss','sub','repository_id','repository_owner_id','ref','job_workflow_ref')}, sort_keys=True))
          PY
