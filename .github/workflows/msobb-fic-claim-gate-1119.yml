name: MSOBB FIC claim gate 1119
on:
  push:
    branches:
      - 'msobb-fic-*'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  claim_gate:
    runs-on: ubuntu-latest
    steps:
      - name: Print only OIDC claim selectors
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, urllib.parse, urllib.request
          base = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          sep = "&" if "?" in base else "?"
          url = base + sep + "audience=" + urllib.parse.quote("api://AzureADTokenExchange", safe="")
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(request, timeout=15) as response:
              token = json.load(response)["value"]
          body = token.split(".")[1]
          body += "=" * (-len(body) % 4)
          claims = json.loads(base64.urlsafe_b64decode(body))
          keep = ("iss", "sub", "aud", "repository_id", "repository_owner_id", "ref", "job_workflow_ref")
          print(json.dumps({k: claims.get(k) for k in keep}, sort_keys=True))
          PY
